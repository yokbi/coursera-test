services:
  db:
    image: postgres:16-alpine
    container_name: habittracker-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-habittracker}
      POSTGRES_USER: ${POSTGRES_USER:-habittracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-habittracker} -d ${POSTGRES_DB:-habittracker}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # C4 — API ve frontend de Compose'da: kurulum "Docker kur + docker compose up".
  #
  # Migration API'nin başlangıcında koşuyor (Development'ta zaten öyleydi);
  # ayrı bir servis eklemedik çünkü bu yığında tek bir API kopyası var ve
  # ikinci bir servis, kurulum adımını ikiye bölmekten başka bir işe yaramazdı.
  api:
    build:
      context: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-habittracker};Username=${POSTGRES_USER:-habittracker};Password=${POSTGRES_PASSWORD:-dev_only_password}"
      # Sırlar imajda değil, ortamda. Tanımsızsa API kendi geliştirme
      # varsayılanlarıyla açılır — üretimde bunlar verilmek zorunda.
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-}
      Cors__AllowedOrigins__0: ${WEB_ORIGIN:-http://localhost:3000}
      Ai__Provider: ${AI_PROVIDER:-Mock}
    ports:
      - "${API_PORT:-5000}:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        # Tarayıcıdan görülen adres olmalı; `http://api:8080` konteyner ağında
        # geçerli ama tarayıcıda çözülmez.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  db-data:
