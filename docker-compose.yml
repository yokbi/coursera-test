services:
  db:
    image: postgres:16-alpine
    container_name: habittracker-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-habittracker}
      POSTGRES_USER: ${POSTGRES_USER:-habittracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-habittracker} -d ${POSTGRES_DB:-habittracker}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
